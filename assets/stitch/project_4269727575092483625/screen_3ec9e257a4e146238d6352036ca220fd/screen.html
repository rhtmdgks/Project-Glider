<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile Completion - The Curator</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#f9f9f9",
                        "primary-fixed-dim": "#b1c5ff",
                        "tertiary-fixed": "#ffdbcf",
                        "surface-container-low": "#f3f3f3",
                        "surface-container": "#eeeeee",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-primary-container": "#a5bdff",
                        "secondary": "#5f5e5e",
                        "on-background": "#1b1b1b",
                        "tertiary": "#651f00",
                        "on-primary-fixed-variant": "#00419e",
                        "primary-fixed": "#dae2ff",
                        "tertiary-container": "#8b2e01",
                        "surface-container-high": "#e8e8e8",
                        "surface": "#f9f9f9",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#802900",
                        "primary": "#00327d",
                        "on-surface-variant": "#434653",
                        "surface-dim": "#dadada",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e2e2e2",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f1f1f1",
                        "secondary-container": "#e2dfde",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#b1c5ff",
                        "on-surface": "#1b1b1b",
                        "surface-tint": "#2559bd",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#ffaa8a",
                        "on-error": "#ffffff",
                        "background": "#f9f9f9",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#636262",
                        "surface-variant": "#e2e2e2",
                        "on-primary-fixed": "#001946",
                        "inverse-surface": "#303030",
                        "outline-variant": "#c3c6d5",
                        "tertiary-fixed-dim": "#ffb59a",
                        "secondary-fixed": "#e5e2e1",
                        "primary-container": "#0047ab",
                        "outline": "#737784",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#474746",
                        "on-tertiary-fixed": "#380d00"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f9f9f9;
            color: #1b1b1b;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar suppressed for Transactional Flow focus -->
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 md:py-20">
<div class="w-full max-w-xl">
<!-- Header Section -->
<header class="mb-12 text-center md:text-left">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container text-white rounded-full mb-6">
<span class="material-symbols-outlined text-3xl" data-icon="face">face</span>
</div>
<h1 class="text-4xl font-extrabold tracking-tight text-on-surface mb-3 leading-tight">Personalize Your Journey</h1>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-md">Help us tailor The Curator experience to your taste and lifestyle.</p>
</header>
<!-- Profile Completion Form -->
<form class="space-y-8">
<!-- Identity Section -->
<section class="bg-surface-container-low p-8 rounded-xl">
<h2 class="text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-6">Identity</h2>
<div class="space-y-6">
<div class="relative">
<label class="block text-sm font-semibold mb-2 ml-1 text-on-surface" for="name">Full Name</label>
<input class="w-full bg-surface-container-lowest border-none rounded-xl px-6 py-4 focus:ring-2 focus:ring-primary-container transition-all placeholder:opacity-30" id="name" placeholder="Alex Curator" type="text"/>
</div>
</div>
</section>
<!-- Logistics Section -->
<section class="bg-surface-container-low p-8 rounded-xl">
<h2 class="text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-6">Delivery Oasis</h2>
<div class="space-y-6">
<div class="relative">
<label class="block text-sm font-semibold mb-2 ml-1 text-on-surface" for="address">Residential Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-40" data-icon="location_on">location_on</span>
<input class="w-full bg-surface-container-lowest border-none rounded-xl pl-12 pr-6 py-4 focus:ring-2 focus:ring-primary-container transition-all placeholder:opacity-30" id="address" placeholder="123 Serenity Lane, Suite 400" type="text"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-semibold mb-2 ml-1 text-on-surface" for="city">City</label>
<input class="w-full bg-surface-container-lowest border-none rounded-xl px-6 py-4 focus:ring-2 focus:ring-primary-container transition-all placeholder:opacity-30" id="city" placeholder="New York" type="text"/>
</div>
<div>
<label class="block text-sm font-semibold mb-2 ml-1 text-on-surface" for="zip">Postal Code</label>
<input class="w-full bg-surface-container-lowest border-none rounded-xl px-6 py-4 focus:ring-2 focus:ring-primary-container transition-all placeholder:opacity-30" id="zip" placeholder="10001" type="text"/>
</div>
</div>
</div>
</section>
<!-- Payment Preference Section -->
<section class="bg-surface-container-low p-8 rounded-xl">
<h2 class="text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-6">Seamless Settlement</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<label class="relative flex items-center p-4 bg-surface-container-lowest rounded-xl cursor-pointer hover:ring-2 hover:ring-outline-variant transition-all group">
<input checked="" class="hidden peer" name="payment" type="radio"/>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mr-4 group-peer-checked:bg-primary-container group-peer-checked:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
</div>
<div>
<p class="text-sm font-bold text-on-surface">Card</p>
<p class="text-xs text-on-surface-variant">Instant checkout</p>
</div>
<div class="absolute right-4 opacity-0 peer-checked:opacity-100 text-primary-container transition-opacity">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<label class="relative flex items-center p-4 bg-surface-container-lowest rounded-xl cursor-pointer hover:ring-2 hover:ring-outline-variant transition-all group">
<input class="hidden peer" name="payment" type="radio"/>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mr-4 group-peer-checked:bg-primary-container group-peer-checked:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div>
<p class="text-sm font-bold text-on-surface">Wallet</p>
<p class="text-xs text-on-surface-variant">Digital credits</p>
</div>
<div class="absolute right-4 opacity-0 peer-checked:opacity-100 text-primary-container transition-opacity">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
</div>
</section>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-primary-container text-white py-5 rounded-full text-lg font-bold shadow-lg shadow-primary-container/20 hover:scale-[1.02] active:scale-95 transition-all duration-300" type="submit">
                        Complete Onboarding
                    </button>
<p class="text-center mt-6 text-sm text-on-surface-variant font-medium opacity-60">
                        You can update these settings anytime in your profile.
                    </p>
</div>
</form>
</div>
</main>
<!-- Visual Background Element (Asymmetric AI-inspired shape) -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-screen bg-gradient-to-l from-primary-container/5 to-transparent pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-64 h-64 bg-primary-container/5 rounded-full blur-3xl -translate-x-1/2 translate-y-1/2 pointer-events-none"></div>
</body></html>
