<span class="text-primary-container font-extrabold tracking-tighter text-2xl">The Curator</span>
<p class="mt-2 text-on-surface-variant font-medium leading-relaxed">
                    Your personal AI purchase concierge. Refining the way you discover and acquire.
                </p>
</div>
</div>
</div>

<div class="w-full max-w-md flex flex-col space-y-8">

<div class="text-center space-y-2">

<p class="text-on-surface-variant text-base">Select your preferred way to continue</p>
</div>
<!-- Auth Actions Grid -->
<div class="flex flex-col space-y-3">
<!-- Primary CTA: Phone -->
<button class="group flex items-center justify-between w-full h-16 px-6 rounded-full bg-primary-container text-white active:scale-95 transition-all duration-200">
<div class="flex items-center space-x-4">
<span class="material-symbols-outlined text-2xl" data-icon="smartphone">smartphone</span>
<span class="font-semibold text-lg">Continue with Phone</span>
</div>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-opacity" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary Actions: Glass/Matte Style -->
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-center justify-center h-28 p-4 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-3xl mb-2 text-on-surface-variant" data-icon="mail">mail</span>
<span class="text-sm font-semibold tracking-wide">Email</span>
</button>
<button class="flex flex-col items-center justify-center h-28 p-4 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-3xl mb-2 text-on-surface-variant" data-icon="account_circle">account_circle</span>
<span class="text-sm font-semibold tracking-wide">Social</span>
</button>
</div>
</div>

<div class="mt-4 px-2">
<div class="flex items-start space-x-4">
<div class="w-8 h-8 rounded-full bg-primary-container/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container text-lg" data-icon="auto_awesome">auto_awesome</span>
</div>
<p class="text-sm text-on-surface-variant leading-relaxed">

                </p>
</div>
</div>

<button class="text-sm font-bold uppercase tracking-widest text-on-surface-variant hover:text-primary-container transition-colors">
                Need help with your account?
            </button>
</div>
</div>

<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -right-[5%] w-[40%] h-[40%] bg-primary-container/5 rounded-full blur-[120px]"></div>
